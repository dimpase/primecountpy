name: Build & Test

on:
  pull_request:
    types: [opened, synchronize]
  push:
  workflow_dispatch:
    # Allow to run manually

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} with python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-14', 'macos-latest', 'ubuntu-latest', 'windows-latest']
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - name: Set up the repository
      uses: actions/checkout@v4
      with:
          submodules: recursive
          fetch-depth: 0
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Configure MSVC compiler
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "CC=cl" >> $env:GITHUB_ENV
        "CXX=cl" >> $env:GITHUB_ENV
    - name: Prepare build dependencies
      run: |
        uv sync --frozen --inexact -v --no-install-project
    - name: Install Homebrew primecount
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install primecount
    - name: Build with system primecount
      if: matrix.os == 'macos-latest'
      run: uv sync --frozen --inexact -v --no-build-isolation --no-editable --config-settings=builddir=builddir --config-settings=setup-args="--wrap-mode=nodownload"
    - name: Build with bundled primecount
      if: matrix.os != 'macos-latest'
      run: uv sync --frozen --inexact -v --no-build-isolation --no-editable --config-settings=builddir=builddir
    - name: Test
      run: |
        cd builddir
        uv run meson test -v
