[build-system]
requires = ["meson-python>=0.16.0", "Cython>=3.0", "cysignals"]
build-backend = "mesonpy"

[project]
name = "primecountpy"
dynamic = ["version"]
description = "Cython interface for C++ primecount library"
authors = [
    { name = "SageMath Developers", email = "sage-devel@googlegroups.com" },
]
dependencies = ["cysignals"]
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/dimpase/primecountpy"
"User Manual" = "https://primecountpy.readthedocs.io"
"Bug Tracker" = "https://github.com/dimpase/primecountpy/issues"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "cibuildwheel>=2.23.3",
    "cython>=3.1.4",
    "cysignals>=1.11.2",
    "meson>=1.9.0",
    "meson-python>=0.18.0",
    "ninja>=1.13.0",
    "pkgconf>=2.4.3.post2",
    "pytest>=8.4.2",
    "pytest-cython>=0.3.0",
]

[project.optional-dependencies]
doc = ["sphinx", "myst_parser"]

[tool.meson-python.args]
# Don't install subprojects and ensure that targets are built as static
# as per https://mesonbuild.com/meson-python/how-to-guides/shared-libraries.html#static-library-from-subproject
setup = ['--default-library=static']
install = ['--skip-subprojects']

[tool.cibuildwheel]
enable = ["cpython-freethreading"]
skip = ["*-win32", "cp313t-*"]
#test-groups = ["dev"]
build-frontend = "build[uv]"
test-command = "python -c \"from primecountpy import nth_prime, prime_pi; assert prime_pi(1000) == 168; assert nth_prime(168) == 997\""

[tool.cibuildwheel.windows]
environment = { CC = "cl", CXX = "cl" }
repair-wheel-command = "uv tool run --from delvewheel delvewheel repair -w {dest_dir} {wheel}"
